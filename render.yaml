services:
  - type: web
    name: olius-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_LOCAL_ADMIN_DEMO
        value: 'false'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
